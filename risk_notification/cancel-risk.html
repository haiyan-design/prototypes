<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>取消订单风险提示</title>
  <style>
    :root {
      --teal: #1aa6a0;
      --orange: #ff6614;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #e8eaed;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      gap: 4px;
    }
    .page-title { text-align: center; flex-shrink: 0; }
    .page-title h1 { font-size: 13px; font-weight: 600; }

    .scene-tabs {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-bottom: 2px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .scene-tabs a {
      border: 1px solid #ccc;
      background: #fff;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 12px;
      color: #555;
      text-decoration: none;
    }
    .scene-tabs a.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    .stage-frame {
      --fit: min(1, (100vh - 48px) / 640, (100vw - 24px) / 340);
      width: calc(320px * var(--fit));
      height: calc(640px * var(--fit));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stage { transform: scale(var(--fit)); transform-origin: center center; }

    .phone {
      width: 320px;
      height: 640px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,.14);
      position: relative;
      display: flex;
      flex-direction: column;
      border: 5px solid #1c1c1e;
    }

    .status-bar {
      height: 18px;
      background: var(--teal);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 12px 1px;
      font-size: 9px;
      color: #fff;
      flex-shrink: 0;
    }
    .header {
      background: var(--teal);
      color: #fff;
      padding: 0 12px 10px;
      flex-shrink: 0;
    }
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      font-size: 15px;
    }
    .header-nav .title { font-weight: 500; }
    .header-nav .right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .header-nav .pill {
      width: 22px; height: 22px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 50%;
    }

    .page-bg {
      flex: 1;
      background: #f3f4f6;
      position: relative;
      min-height: 0;
    }
    .page-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1;
    }

    .cancel-sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: #fff;
      border-radius: 12px 12px 0 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      max-height: 88%;
    }

    .cancel-hd {
      position: relative;
      text-align: center;
      padding: 16px 40px 12px;
      font-size: 17px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .cancel-hd .x {
      position: absolute;
      right: 14px;
      top: 14px;
      border: none;
      background: transparent;
      color: #999;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
    }

    .cancel-body {
      padding: 0 16px 6px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    /* 与截图一致：灰框 + 文案 + 右下角一键举报 */
    .risk-box {
      position: relative;
      background: #f2f3f5;
      border-radius: 6px;
      padding: 10px 12px 36px;
      margin-bottom: 10px;
    }
    .risk-text {
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }
    .risk-text .tag { color: #333; font-weight: 600; }
    .risk-text strong {
      font-weight: 700;
      color: #333;
    }
    .risk-text .link-report {
      color: var(--teal);
      font-weight: 500;
    }
    .btn-report {
      position: absolute;
      right: 10px;
      bottom: 8px;
      border: none;
      background: var(--teal);
      color: #fff;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 14px;
      cursor: pointer;
    }

    .refund-tip {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 8px 10px;
      background: #fff8f0;
      border: 1px solid #ffe0c2;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .refund-tip .i {
      flex-shrink: 0;
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 1px solid var(--orange);
      color: var(--orange);
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      font-style: normal;
    }
    .refund-tip .hl { color: var(--orange); }

    .reason {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 2px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 15px;
      color: #333;
      cursor: pointer;
    }
    .reason:last-child { border-bottom: none; }
    .reason .radio {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1.5px solid #c8c8c8;
      flex-shrink: 0;
      background: #fff;
    }
    .reason.on .radio {
      border-color: var(--teal);
      background: radial-gradient(circle, var(--teal) 45%, #fff 48%);
    }

    .cancel-ft {
      display: flex;
      gap: 12px;
      padding: 12px 16px 16px;
      flex-shrink: 0;
    }
    .btn-ghost {
      flex: 1;
      height: 44px;
      border: 1px solid #ddd;
      border-radius: 22px;
      background: #fff;
      color: #666;
      font-size: 16px;
      cursor: pointer;
    }
    .btn-primary {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: 22px;
      background: var(--teal);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page-title">
    <h1>小程序风险告知</h1>
  </div>
  <div class="scene-tabs">
    <a href="小程序风险告知.html">下单页风险告知</a>
    <a href="call-risk.html">打电话页风险告知</a>
    <a href="detail-risk.html">详情页风险告知</a>
    <a class="active" href="cancel-risk.html">取消订单风险提示</a>
  </div>

  <div class="stage-frame">
    <div class="stage">
      <div class="phone">
        <div class="status-bar"><span>9:41</span><span>●●●</span></div>
        <div class="header">
          <div class="header-nav">
            <span>‹</span>
            <span class="title">订单详情</span>
            <span class="right"><span class="pill"></span><span>· · ·</span></span>
          </div>
        </div>

        <div class="page-bg">
          <div class="cancel-sheet">
            <div class="cancel-hd">
              取消订单
              <button type="button" class="x" aria-label="关闭">×</button>
            </div>
            <div class="cancel-body">
              <div class="risk-box">
                <div class="risk-text">
                  <span class="tag">【风险提示】</span>若对方要求取消订单后私下交易，请勿确认取消。由此产生的纠纷及人身、财产损失，平台<strong>概不负责</strong>。如遇诱导，请使用<span class="link-report">「一键举报」</span>向我们反馈。
                </div>
                <button type="button" class="btn-report">一键举报</button>
              </div>

              <div class="refund-tip">
                <i class="i">i</i>
                <span>取消后将退还预约次数。<span class="hl">如需退款，请在取消成功后发起退款</span></span>
              </div>

              <div class="reason"><span class="radio"></span>时间有变</div>
              <div class="reason"><span class="radio"></span>服务人员无法提供服务</div>
              <div class="reason"><span class="radio"></span>对服务人员不满意</div>
              <div class="reason"><span class="radio"></span>服务人员联系不上</div>
              <div class="reason"><span class="radio"></span>长时间无人接单</div>
              <div class="reason"><span class="radio"></span>客服无响应</div>
              <div class="reason"><span class="radio"></span>其他</div>
            </div>
            <div class="cancel-ft">
              <button type="button" class="btn-ghost">取消</button>
              <button type="button" class="btn-primary">确认</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.reason').forEach(function (el) {
      el.addEventListener('click', function () {
        document.querySelectorAll('.reason').forEach(function (r) { r.classList.remove('on'); });
        el.classList.add('on');
      });
    });
    document.querySelector('.btn-report').addEventListener('click', function () {
      alert('跳转客服举报（示意）');
    });
  </script>
</body>
</html>
