<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>e护通 · 再来一单</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #e8ecef;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      color: #333;
    }
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e5e5e5;
      padding: 20px 14px 28px;
      overflow-y: auto;
      max-height: 100vh;
    }
    .sidebar h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      padding: 0 6px;
    }
    .sidebar .sub {
      font-size: 12px;
      color: #999;
      margin-bottom: 18px;
      padding: 0 6px;
      line-height: 1.4;
    }
    .group {
      margin-bottom: 14px;
    }
    .group-title {
      font-size: 12px;
      color: #999;
      font-weight: 500;
      padding: 6px 8px 4px;
      letter-spacing: 0.02em;
    }
    .group-btns {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .group-btns.row {
      flex-direction: row;
      gap: 6px;
    }
    .group-btns.row button {
      flex: 1;
      text-align: center;
    }
    .sidebar button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #444;
      background: transparent;
      border: 0;
      cursor: pointer;
      line-height: 1.3;
    }
    .sidebar button:hover {
      background: #f3faf8;
      color: #1fb5a6;
    }
    .sidebar button.active {
      background: #1fb5a6;
      color: #fff;
      font-weight: 500;
    }
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      min-width: 0;
    }
    .phone {
      width: 375px;
      height: 700px;
      border-radius: 28px;
      overflow: hidden;
      background: #f5f5f5;
      box-shadow:
        0 0 0 8px #1c1c1e,
        0 0 0 10px #3a3a3c,
        0 16px 36px rgba(0,0,0,.18);
    }
    .phone iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #f5f5f5;
    }
    @media (max-width: 720px) {
      body { flex-direction: column; }
      .sidebar {
        width: 100%;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid #e5e5e5;
        padding: 12px;
      }
      .group { margin-bottom: 8px; }
      .group-btns.row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="nav">
    <h1>再来一单 · 原型</h1>
    <p class="sub">按订单状态切换；同状态下列表 / 详情成组</p>

    <div class="group">
      <div class="group-title">首页 · 人维度</div>
      <div class="group-btns">
        <button type="button" class="active" data-src="pages/home.html?v=72">首页弹窗推上次服务人员</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">服务已完成</div>
      <div class="group-btns">
        <button type="button" data-src="pages/order-completed.html">详情</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">评价完成</div>
      <div class="group-btns">
        <button type="button" data-src="pages/order-reviewed.html">详情</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">已取消</div>
      <div class="group-btns row">
        <button type="button" data-src="pages/order-list-cancelled.html">列表</button>
        <button type="button" data-src="pages/order-detail-cancelled.html">详情</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">退款成功</div>
      <div class="group-btns">
        <button type="button" data-src="pages/order-list-refunded.html">列表</button>
      </div>
      <div class="group-btns row" style="margin-top:4px">
        <button type="button" data-src="pages/order-detail-refunded.html">未预约详情</button>
        <button type="button" data-src="pages/order-detail-booked.html">已预约详情</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">待完成 · 所有子单已完成但未入账</div>
      <div class="group-btns row">
        <button type="button" data-src="pages/order-list-pending-complete.html">列表</button>
        <button type="button" data-src="pages/order-detail-pending-complete.html">详情</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">我的</div>
      <div class="group-btns">
        <button type="button" data-src="pages/mine.html">我的订单</button>
        <button type="button" data-src="pages/order-detail-booked.html">订单详情页点服务可进商详页</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">异常与边界</div>
      <div class="group-btns">
        <button type="button" data-src="pages/order-list-cancelled.html?edge=sku-off&v=39">服务不可售 · 列表</button>
        <button type="button" data-src="pages/order-completed.html?edge=sku-off&v=35">服务不可售 · 详情</button>
        <button type="button" data-src="pages/reorder-checkout.html?from=completed&edge=addr-missing&v=65">原地址不存在</button>
        <button type="button" data-src="pages/reorder-checkout.html?from=completed&edge=patient-bad&v=65">被护理人已删除</button>
        <button type="button" data-src="pages/reorder-checkout.html?from=completed&edge=staff-gone&v=65">原人不可用 · 有其他推荐</button>
        <button type="button" data-src="pages/reorder-checkout.html?from=completed&edge=staff-none&v=65">无可选历史人员</button>
      </div>
    </div>
  </aside>

  <div class="stage">
    <div class="phone">
      <iframe id="frame" src="pages/home.html?v=72" title="原型"></iframe>
    </div>
  </div>

  <script>
    var nav = document.getElementById("nav");
    var frame = document.getElementById("frame");
    nav.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-src]");
      if (!btn) return;
      nav.querySelectorAll("button").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      var src = btn.getAttribute("data-src");
      frame.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
    });
  </script>
</body>
</html>
