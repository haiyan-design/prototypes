<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>订单详情 · 服务已完成</title>
  <link rel="stylesheet" href="../css/common.css?v=35" />
</head>
<body>
  <div class="page">
    <div class="status-bar">
      <span>15:04</span>
      <span style="font-size:12px;font-weight:500">▮▮▮</span>
    </div>
    <div class="nav-bar">
      <div class="nav-left">
        <a class="nav-icon" href="javascript:void(0)" aria-label="返回"><span class="icon i-back"></span></a>
      </div>
      <div class="nav-title">订单详情</div>
      <div class="nav-right">
        <div class="mp-capsule">
          <span><span class="icon icon-sm i-more" style="color:#fff"></span></span>
          <span style="font-size:14px;opacity:.9">◎</span>
        </div>
      </div>
    </div>

    <div class="status-hero">
      <h2>服务已完成</h2>
    </div>

    <div class="sheet">
      <div class="card rate-card">
        <div class="rate-ask">
          <div class="avatar-ph">头像</div>
          <div class="ask-main">
            <div class="ask-title">您对我满意吗？ <span class="anon">匿名</span></div>
            <div class="ask-sub">徐测试 3.6分</div>
          </div>
        </div>
        <div class="rate-faces">
          <div class="rate-face bad"><div class="face"><span class="mouth"></span></div>非常差</div>
          <div class="rate-face bad"><div class="face"><span class="mouth"></span></div>不满意</div>
          <div class="rate-face mid"><div class="face"><span class="mouth"></span></div>一般</div>
          <div class="rate-face"><div class="face"><span class="mouth"></span></div>满意</div>
          <div class="rate-face"><div class="face"><span class="mouth"></span></div>很满意</div>
        </div>
      </div>

      <div class="card">
        <div class="info-row"><span class="label">预约服务时间</span><span class="value">10月26日 11:02</span></div>
        <div class="info-row"><span class="label">服务时长</span><span class="value">1次</span></div>
        <div class="info-row"><span class="label">服务地址</span><span class="value">上海市上海市普陀区金沙江路1340弄8号新曹杨中南大厦</span></div>
        <div class="info-row"><span class="label">被护理人信息</span><span class="value">张三 80岁 男</span></div>
      </div>

      <div class="card">
        <div class="goods-row">
          <img class="goods-thumb" src="../assets/service.png" alt="" />
          <div>
            <div class="goods-title">看护测试</div>
            <span class="goods-tag">8小时</span>
          </div>
        </div>
        <div class="price-rows">
          <div class="price-row total"><span class="label">订单总额</span><span class="amount">¥ 610.00</span></div>
          <div class="price-row"><span class="label">服务价格</span><span>¥ 400.00</span></div>
          <div class="price-row"><span class="label">人员等级价格</span><span>¥ 200.00</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-icon">
      <span class="icon i-headset"></span>
      联系客服
    </div>
    <a class="btn btn-primary" href="reorder-checkout.html?from=completed&v=7">再来一单</a>
  </div>
<script src="../js/sku-off.js?v=3"></script>
</body>
</html>
