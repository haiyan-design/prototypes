<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>我的</title>
  <link rel="stylesheet" href="../css/common.css?v=38" />
</head>
<body>
  <div class="page mine">
    <div class="status-bar light">
      <span>13:13</span>
      <span style="font-size:12px;font-weight:500">▮▮▮ 57%</span>
    </div>

    <div class="mine-top">
      <div class="user-row">
        <img class="user-avatar" src="../assets/avatar.png" alt="" />
        <div class="user-name">e护通1328161</div>
        <span class="bell-btn"><span class="icon i-bell"></span></span>
      </div>
    </div>

    <div class="mine-card">
      <div class="mine-card-hd">
        <h3>我的订单</h3>
        <a href="order-list-cancelled.html">全部订单 <span class="icon i-chev"></span></a>
      </div>
      <div class="order-status-row">
        <div class="os-item"><span class="icon i-wallet"></span>待支付</div>
        <div class="os-item"><span class="badge">5</span><span class="icon i-doc"></span>待预约</div>
        <div class="os-item"><span class="badge">1</span><span class="icon i-list"></span>待服务</div>
        <div class="os-item"><span class="icon i-bag"></span>服务中</div>
        <div class="os-item"><span class="badge">1</span><span class="icon i-chat"></span>待评价</div>
      </div>
      <div class="reorder-banner">
        <img class="thumb" src="../assets/service.png" alt="" />
        <div
          class="info"
          tabindex="0"
          title="已完成 / 各种陪护项目 / ¥103.00"
          data-full="已完成 / 各种陪护项目 / ¥103.00"
        >已完成 / 各种陪护项目 / ¥103.00</div>
        <a class="btn btn-sm" href="reorder-checkout.html?from=mine-latest&v=7">再来一单</a>
      </div>
    </div>

    <div class="mine-card">
      <div class="grid-icons">
        <div class="grid-item"><div class="circle"><span class="icon i-msg"></span></div>我的消息</div>
        <div class="grid-item"><div class="circle"><span class="icon i-cart"></span></div>购物车</div>
        <div class="grid-item"><div class="circle"><span class="icon i-phone"></span></div>联系客服</div>
        <div class="grid-item"><div class="circle"><span class="icon i-pin"></span></div>地址管理</div>
        <div class="grid-item"><div class="circle"><span class="icon i-chat"></span></div>关注公众号</div>
        <div class="grid-item"><div class="circle"><span class="icon i-help"></span></div>常见问题</div>
        <div class="grid-item"><div class="circle"><span class="icon i-doc"></span></div>意见反馈</div>
        <div class="grid-item"><div class="circle"><span class="icon i-grid"></span></div>服务兑换</div>
      </div>
    </div>

    <div class="split-cards">
      <div class="box">
        <span class="icon i-user"></span>
        <div>
          <div class="t1">个人资料</div>
          <div class="t2">查看/编辑个人资料</div>
        </div>
      </div>
      <div class="box">
        <span class="icon i-users"></span>
        <div>
          <div class="t1">被护理人</div>
          <div class="t2">已添加 2 位</div>
        </div>
      </div>
    </div>

    <div class="mine-card">
      <div class="mine-card-hd"><h3>我的常用</h3></div>
      <div class="common-row">
        <div class="common-item"><span class="icon i-users"></span>服务人员<span class="sub">服务过我的人</span></div>
        <div class="common-item"><span class="icon i-star"></span>收藏<span class="sub">收藏的宝贝</span></div>
        <div class="common-item"><span class="icon i-star-fill"></span>关注<span class="sub">最近看过</span></div>
        <div class="common-item"><span class="icon i-clock"></span>足迹<span class="sub">今天浏览2</span></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tabbar-item"><span class="icon i-home"></span>首页</div>
    <div class="tabbar-item"><span class="icon i-grid"></span>分类</div>
    <div class="tabbar-center"><span class="icon i-user"></span>e护通智</div>
    <div class="tabbar-item"><span class="icon i-cart"></span>购物车</div>
    <div class="tabbar-item active"><span class="icon i-user"></span>我的</div>
  </div>
<script src="../js/sku-off.js?v=3"></script>
</body>
</html>
