<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>我的订单 · 已取消</title>
  <link rel="stylesheet" href="../css/common.css?v=35" />
</head>
<body>
  <div class="page" style="padding-bottom:16px">
    <div class="status-bar">
      <span>14:48</span>
      <span style="font-size:12px;font-weight:500">▮▮▮ 51%</span>
    </div>
    <div class="nav-bar" style="padding-right:8px">
      <div class="nav-left">
        <a class="nav-icon" href="javascript:void(0)" aria-label="返回"><span class="icon i-back"></span></a>
      </div>
      <div class="nav-title" style="flex:0"></div>
      <div class="nav-right" style="flex:1;justify-content:flex-end">
        <div class="mp-capsule">
          <span><span class="icon icon-sm i-more" style="color:#fff"></span></span>
          <span style="font-size:14px;opacity:.9">◎</span>
        </div>
      </div>
    </div>

    <div class="search-wrap">
      <div class="search-input">
        <span class="icon i-search"></span>
        搜索订单
      </div>
      <span class="search-btn">搜索</span>
    </div>

    <div class="calendar-card">
      <div class="ico-box"><span class="icon i-cal"></span></div>
      <div>
        <div class="t1">服务日历</div>
        <div class="t2">查看待服务 / 服务中安排</div>
      </div>
      <span class="arrow"><span class="icon icon-sm i-chev"></span></span>
    </div>

    <div class="tabs">
      <div class="tab active">全部</div>
      <div class="tab">待支付</div>
      <div class="tab">待预约</div>
      <div class="tab">待服务</div>
      <div class="tab">服务中</div>
      <div class="tab">待评价</div>
    </div>

    <!-- 已取消订单卡片：联系客服右侧「再来一单」深色引导 -->
    <div class="order-card">
      <div class="order-card-hd">
        <span class="no">订单号: EMD0261027144445101508f0000iBYrQ</span>
        <span class="st">已取消</span>
      </div>
      <a class="goods-row" href="order-detail-cancelled.html">
        <img class="goods-thumb" src="../assets/service.png" alt="" />
        <div style="flex:1;min-width:0">
          <div class="goods-title">住院日间12小时陪护</div>
          <span class="goods-tag">12小时</span>
        </div>
        <span style="color:#bbb;font-size:13px;align-self:flex-start">x1</span>
      </a>
      <div class="order-card-ft stacked">
        <div class="pay-amount">需付款 <strong>¥380.00</strong></div>
        <div class="order-actions">
          <button class="btn btn-ghost" type="button">联系客服</button>
          <a class="btn btn-sm" href="reorder-checkout.html?from=cancelled-list&v=19">再来一单</a>
        </div>
      </div>
    </div>

    <div class="order-card">
      <div class="order-card-hd">
        <span class="no">订单号: EMD0261015132039101508f0000hzZgp</span>
        <span class="st">已取消</span>
      </div>
      <a class="goods-row" href="order-detail-cancelled.html">
        <img class="goods-thumb" src="../assets/service.png" alt="" />
        <div style="flex:1;min-width:0">
          <div class="goods-title">护士居家夜间10小时特护</div>
          <span class="goods-tag">10小时</span>
        </div>
        <span style="color:#bbb;font-size:13px;align-self:flex-start">x1</span>
      </a>
      <div class="order-card-ft stacked">
        <div class="pay-amount">需付款 <strong>¥480.00</strong></div>
        <div class="order-actions">
          <button class="btn btn-ghost" type="button">联系客服</button>
          <a class="btn btn-sm" href="reorder-checkout.html?from=cancelled-list&v=19">再来一单</a>
        </div>
      </div>
    </div>
  </div>
<script src="../js/sku-off.js?v=3"></script>

</html>
